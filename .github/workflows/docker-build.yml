name: Docker Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag leaflet-auto-web-scrapper:${{ github.sha }} .
